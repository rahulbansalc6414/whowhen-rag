[project]
name = "whowhen-rag"
version = "0.1.0"
description = "Detect time and author filters in RAG queries, cheaply: a free regex gate, a yes/no classifier, and your LLM only when a filter is likely."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rahul Bansal" }]
keywords = ["rag", "retrieval", "metadata-filtering", "query-understanding", "llm", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["typesafe-sdk>=0.7"]

[project.urls]
Homepage = "https://github.com/rahulbansalc6414/whowhen-rag"
Issues = "https://github.com/rahulbansalc6414/whowhen-rag/issues"
Changelog = "https://github.com/rahulbansalc6414/whowhen-rag/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
